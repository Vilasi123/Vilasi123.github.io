<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ENTRY Scanner</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #08090d;
      --surface:   #0f1117;
      --border:    #1e2130;
      --accent:    #e8ff47;
      --accent2:   #47c8ff;
      --text:      #f0f2ff;
      --muted:     #6b7280;
      --success:   #3dff8f;
      --error:     #ff5f5f;
      --radius:    18px;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      overflow-x: hidden;
    }

    /* ── Grid bg ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(71,200,255,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(71,200,255,.04) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    /* ── Ambient glow ── */
    .glow-top {
      position: fixed;
      top: -200px; left: 50%;
      transform: translateX(-50%);
      width: 700px; height: 400px;
      background: radial-gradient(ellipse, rgba(71,200,255,.12) 0%, transparent 70%);
      pointer-events: none;
    }

    /* ── Layout ── */
    .page {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 60px;
      gap: 0;
    }

    /* ── Top nav bar ── */
    .topbar {
      width: 100%;
      max-width: 540px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 40px;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .status-dot {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .78rem;
      color: var(--muted);
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,100% { opacity:1; box-shadow: 0 0 0 0 rgba(61,255,143,.4); }
      50%      { opacity:.6; box-shadow: 0 0 0 6px rgba(61,255,143,0); }
    }

    /* ── Checkpoint badge ── */
    .checkpoint-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 36px;
    }

    .cp-icon {
      width: 60px; height: 60px;
      border-radius: 50%;
      background: rgba(71,200,255,.08);
      border: 1px solid rgba(71,200,255,.25);
      display: grid;
      place-items: center;
      font-size: 1.6rem;
      box-shadow: 0 0 28px rgba(71,200,255,.15);
    }

    .cp-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: .04em;
      color: var(--accent2);
    }

    .cp-sub {
      font-size: .8rem;
      color: var(--muted);
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    /* ── Scanner card ── */
    .scanner-card {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
    }

    /* Corner accents */
    .scanner-card::before,
    .scanner-card::after {
      content: '';
      position: absolute;
      width: 28px; height: 28px;
      border-color: var(--accent2);
      border-style: solid;
      z-index: 10;
      pointer-events: none;
    }
    .scanner-card::before {
      top: 14px; left: 14px;
      border-width: 2px 0 0 2px;
      border-radius: 4px 0 0 0;
    }
    .scanner-card::after {
      bottom: 14px; right: 14px;
      border-width: 0 2px 2px 0;
      border-radius: 0 0 4px 0;
    }

    /* top corner pair */
    .scanner-card .corner-tr,
    .scanner-card .corner-bl {
      position: absolute;
      width: 28px; height: 28px;
      border-color: var(--accent2);
      border-style: solid;
      z-index: 10;
      pointer-events: none;
    }
    .corner-tr {
      top: 14px; right: 14px;
      border-width: 2px 2px 0 0;
      border-radius: 0 4px 0 0;
    }
    .corner-bl {
      bottom: 14px; left: 14px;
      border-width: 0 0 2px 2px;
      border-radius: 0 0 0 4px;
    }

    .card-header {
      padding: 18px 22px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-header span {
      font-family: 'Syne', sans-serif;
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .card-header .live-badge {
      margin-left: auto;
      background: rgba(61,255,143,.08);
      border: 1px solid rgba(61,255,143,.2);
      color: var(--success);
      font-size: .68rem;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 100px;
    }

    /* ── QR reader area ── */
    #reader {
      width: 100% !important;
      background: #000;
    }

    /* ── Override html5-qrcode default styles ── */
    #reader video {
      width: 100% !important;
      border-radius: 0 !important;
    }

    #reader__scan_region {
      background: #000 !important;
      border: none !important;
    }

    /* Dashboard wrapper */
    #reader__dashboard {
      background: var(--surface) !important;
      border: none !important;
      padding: 16px 18px !important;
    }

    /* Section dividers inside dashboard */
    #reader__dashboard_section_swaplink,
    #reader__dashboard_section_csr,
    #reader__dashboard_section_fsr {
      border: none !important;
      padding: 0 !important;
    }

    /* "Request Camera Permissions" button & "Scan an Image File" button */
    #reader__dashboard button,
    #reader__camera_permission_button,
    #html5-qrcode-button-camera-permission,
    #html5-qrcode-button-camera-start,
    #html5-qrcode-button-camera-stop,
    #html5-qrcode-button-file-selection {
      background: rgba(71,200,255,.08) !important;
      color: var(--accent2) !important;
      border: 1px solid rgba(71,200,255,.28) !important;
      border-radius: 10px !important;
      font-family: 'Syne', sans-serif !important;
      font-size: .82rem !important;
      font-weight: 700 !important;
      letter-spacing: .06em !important;
      padding: 10px 18px !important;
      cursor: pointer !important;
      transition: background .2s, box-shadow .2s !important;
      width: 100% !important;
      margin: 6px 0 !important;
    }

    #reader__dashboard button:hover,
    #html5-qrcode-button-camera-permission:hover,
    #html5-qrcode-button-camera-start:hover,
    #html5-qrcode-button-camera-stop:hover,
    #html5-qrcode-button-file-selection:hover {
      background: rgba(71,200,255,.16) !important;
      box-shadow: 0 0 16px rgba(71,200,255,.18) !important;
    }

    /* Camera select dropdown */
    #reader__camera_selection,
    #html5-qrcode-select-camera {
      background: var(--bg) !important;
      color: var(--text) !important;
      border: 1px solid var(--border) !important;
      border-radius: 10px !important;
      font-family: 'DM Sans', sans-serif !important;
      font-size: .85rem !important;
      padding: 9px 12px !important;
      width: 100% !important;
      margin: 6px 0 !important;
      outline: none !important;
      cursor: pointer !important;
    }

    /* Status / anchor text */
    #reader__status_span,
    #reader__dashboard_section_swaplink a {
      color: var(--muted) !important;
      font-family: 'DM Sans', sans-serif !important;
      font-size: .78rem !important;
      text-decoration: none !important;
      display: block !important;
      text-align: center !important;
      margin: 8px 0 4px !important;
    }

    #reader__dashboard_section_swaplink a:hover {
      color: var(--accent) !important;
    }

    /* File input label strip */
    #reader__filescan_input {
      display: none !important;
    }

    /* ── Scan overlay ── */
    .scan-line {
      position: absolute;
      left: 0; right: 0;
      top: 50%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent2), transparent);
      animation: scanline 2.4s ease-in-out infinite;
      pointer-events: none;
      z-index: 5;
    }

    @keyframes scanline {
      0%   { top: 20%; opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { top: 80%; opacity: 0; }
    }

    /* ── Card footer ── */
    .card-footer {
      padding: 16px 22px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-footer small {
      color: var(--muted);
      font-size: .75rem;
    }

    .fps-badge {
      color: var(--muted);
      font-family: 'Syne', sans-serif;
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    /* ── Instruction ── */
    .instruction {
      margin-top: 28px;
      text-align: center;
      max-width: 340px;
    }

    .instruction p {
      color: var(--muted);
      font-size: .85rem;
      line-height: 1.65;
    }

    .instruction strong {
      color: var(--accent);
    }

    /* ── Result overlay (hidden by default) ── */
    #result-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(8,9,13,.92);
      backdrop-filter: blur(12px);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      text-align: center;
    }

    #result-overlay.active { display: flex; }

    .result-icon {
      width: 80px; height: 80px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 2.2rem;
      margin-bottom: 24px;
      animation: popIn .4s cubic-bezier(.34,1.56,.64,1) forwards;
    }

    @keyframes popIn {
      from { opacity:0; transform:scale(.5); }
      to   { opacity:1; transform:scale(1); }
    }

    .result-icon.success { background: rgba(61,255,143,.1); border: 2px solid rgba(61,255,143,.3); box-shadow: 0 0 40px rgba(61,255,143,.2); }
    .result-icon.error   { background: rgba(255,95,95,.1);  border: 2px solid rgba(255,95,95,.3);  box-shadow: 0 0 40px rgba(255,95,95,.2); }

    #result-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 10px;
    }

    #result-msg {
      color: var(--muted);
      font-size: .9rem;
      line-height: 1.6;
      max-width: 300px;
      margin-bottom: 36px;
    }

    .result-btn {
      padding: 13px 32px;
      background: var(--accent);
      color: #08090d;
      font-family: 'Syne', sans-serif;
      font-size: .9rem;
      font-weight: 700;
      border: none;
      border-radius: 100px;
      cursor: pointer;
      transition: transform .15s, box-shadow .2s;
    }

    .result-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 24px rgba(232,255,71,.3);
    }

    /* ── Bottom stats ── */
    .stats-row {
      margin-top: 44px;
      display: flex;
      gap: 24px;
      max-width: 400px;
      width: 100%;
    }

    .stat-card {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 16px;
      text-align: center;
    }

    .stat-val {
      font-family: 'Syne', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--accent2);
      display: block;
    }

    .stat-label {
      font-size: .72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .1em;
      margin-top: 4px;
      display: block;
    }

    /* ── Mobile tweaks ── */
    @media (max-width: 480px) {
      .cp-title { font-size: 1.3rem; }
      .stats-row { flex-direction: row; gap: 12px; }
    }
  </style>
</head>
<body>

<div class="glow-top"></div>

<div class="page">

  <!-- Topbar -->
  <nav class="topbar">
    <span class="logo">Event</span>
    <div class="status-dot">
      <div class="dot"></div>
      <span>Scanner Active</span>
    </div>
  </nav>

  <!-- Checkpoint ID -->
  <div class="checkpoint-badge">
    <div class="cp-icon">📍</div>
    <div class="cp-title">ENTRY</div>
    <div class="cp-sub">Checkpoint</div>
  </div>

  <!-- Scanner card -->
  <div class="scanner-card">
    <div class="corner-tr"></div>
    <div class="corner-bl"></div>

    <div class="card-header">
      <span>QR Reader</span>
      <div class="live-badge">● Live</div>
    </div>

    <div style="position:relative;">
      <div id="reader"></div>
      <div class="scan-line"></div>
    </div>

    <div class="card-footer">
      <small>Point camera at attendee's QR pass</small>
    </div>
  </div>

  <!-- Instruction -->
  <div class="instruction">
    <p>Hold the QR code steady within the frame.<br>
    Entry will be <strong>logged automatically</strong> upon scan.</p>
  </div>

  <!-- Stats row -->
  <div class="stats-row">
    <div class="stat-card">
      <span class="stat-val" id="scan-checkpoint">ENTRY</span>
      <span class="stat-label">Checkpoint</span>
    </div>
  </div>

</div>

<!-- Result overlay -->
<div id="result-overlay">
  <div class="result-icon success" id="result-icon">✓</div>
  <div id="result-title">Redirecting…</div>
  <div id="result-msg">Processing your scan. Please wait.</div>
  <button class="result-btn" onclick="dismissResult()">Scan Next</button>
</div>

<script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz2aS1s50IKQ0SV9B8zg8F8B8yiPdcS8NtYDrmaLdvlSsEbOanc8wosGi_42EJ1sP1q/exec";
  const CHECKPOINT  = "ENTRY";
  let scanCount = 0;

  function onScanSuccess(decodedText) {
    html5QrcodeScanner.clear();

    let id = null;
    try {
      const url = new URL(decodedText);
      id = url.searchParams.get("id");
    } catch (_) {
      id = null;
    }

    const overlay   = document.getElementById("result-overlay");
    const iconEl    = document.getElementById("result-icon");
    const titleEl   = document.getElementById("result-title");
    const msgEl     = document.getElementById("result-msg");

    if (!id) {
      iconEl.className  = "result-icon error";
      iconEl.textContent = "✕";
      titleEl.textContent = "Invalid QR Code";
      msgEl.textContent   = "This QR code is not recognised. Please ask the attendee to contact support.";
      overlay.classList.add("active");
      return;
    }

    iconEl.className  = "result-icon success";
    iconEl.textContent = "✓";
    titleEl.textContent = "Pass Verified";
    msgEl.textContent   = `Logging entry at ${CHECKPOINT} checkpoint…`;
    overlay.classList.add("active");

    setTimeout(() => {
      window.location.href = `${WEB_APP_URL}?id=${id}&checkpoint=${CHECKPOINT}`;
    }, 1200);
  }

  function dismissResult() {
    document.getElementById("result-overlay").classList.remove("active");
    // Re-init scanner
    html5QrcodeScanner.render(onScanSuccess);
  }

  const html5QrcodeScanner = new Html5QrcodeScanner(
    "reader",
    { fps: 10, qrbox: { width: 240, height: 240 }, aspectRatio: 1 }
  );
  html5QrcodeScanner.render(onScanSuccess);
</script>
</body>
</html>
