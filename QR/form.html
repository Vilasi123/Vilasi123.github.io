<!DOCTYPE html>
<html>
<head>
  <title>Event Registration</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 40px;
    }
    input {
      display: block;
      margin: 10px auto;
      padding: 10px;
      width: 250px;
    }
    button {
      padding: 12px 20px;
      background: blue;
      color: white;
      border: none;
      border-radius: 5px;
    }
  </style>
</head>
<body>

<h2>Event Registration</h2>

<form action="https://script.google.com/macros/s/AKfycbyZRnzW0v_VyMQWyAdnSfR3SeNzxoL22myMJyW5UuiXkZiv9Eg_P9pren0A3ZeIrNty/exec" method="POST">
  <input name="name" placeholder="Name" required>
  <input name="phone" placeholder="Phone Number" required>
  <input name="email" placeholder="Email">
  <input name="company" placeholder="Company">
  <input name="designation" placeholder="Designation">
  <button type="submit">Register</button>
</form>

</body>
</html>
